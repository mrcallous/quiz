<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMP逐题复盘</title>
<style>
:root{color-scheme:light;--ink:#16312d;--muted:#52665f;--line:#d8e5df;--paper:#f3f7f3;--green:#1d6452}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1120px;padding:28px 22px 40px;margin:auto}header{padding:24px 28px;background:#163e34;color:#fff;border-radius:16px}
h1{font-size:30px;line-height:1.35;margin:0 0 12px}header p{margin:7px 0;color:#dcece4}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.metrics span,.report-button{display:inline-flex;align-items:center;padding:8px 12px;border:1px solid #729286;border-radius:8px}
.report-button{background:#245747;color:#fff;text-decoration:none;font-weight:650}.report-button:hover{background:#306b5a}
.filter-panel{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.filter-panel>summary{cursor:pointer;font-weight:650;color:var(--green);min-height:30px}.filter-panel>summary span{font-size:13px;font-weight:400;color:var(--muted);margin-left:10px}
fieldset{border:0;margin:12px 0 0;padding:0;min-width:0}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:10px}
select,input[type=search],button{min-width:0;max-width:100%;font:inherit;color:var(--ink);padding:10px 12px;border:1px solid #b8cdc1;border-radius:8px;background:#fff;min-height:44px}
select,input[type=search]{width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.toggles{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.toggles label{display:flex;align-items:center;gap:7px;min-height:40px;cursor:pointer;font-size:14px}.toggles input{width:17px;height:17px;accent-color:var(--green);margin:0}
.info{color:var(--muted);font-size:14px}.results-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}
#list{overflow-wrap:anywhere}.loading,.empty,#load-error{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin:16px 0}
#load-error p{margin:0 0 12px}#load-error[hidden]{display:none}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 25px;margin:16px 0}
.q h2{font-size:18px;line-height:1.6;margin:0 0 10px}.q h2 .info{display:block;font-weight:400;font-size:12px;margin-top:3px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 15px}.badge{font-size:12px;border-radius:6px;background:#e9f2ed;padding:3px 8px}
.pending{background:#fff0d7;color:#754607}.resolved{background:#e9f2ed;color:var(--green)}.review-note{background:#fff6e8;border-left:3px solid #dabb83;padding:10px 12px;border-radius:6px;margin:12px 0;font-size:14px}
.stem,.explanation{white-space:pre-wrap;overflow-wrap:anywhere}.options{list-style:none;padding:0;margin:14px 0}.options li{padding:11px 13px;border:1px solid #e3eae6;margin:8px 0;border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere}
.selected{font-weight:650;font-size:14px}.answer{background:#edf7ef;border-left:4px solid var(--green);padding:15px;margin-top:12px;border-radius:4px}
details summary{cursor:pointer;color:var(--green);font-weight:650;min-height:36px;line-height:1.6;padding:5px 0}
.image-review{background:#edf3fb;border:1px solid #c8d7ed;padding:10px 14px;border-radius:9px;margin:12px 0;font-size:14px}.image-review p{margin:8px 0}
.figures-panel{margin:12px 0}.figures{display:grid;gap:12px;margin:10px 0}.figures figure{margin:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.figures img{display:block;max-width:100%;height:auto;margin:auto}.figures figcaption{font-size:13px;color:var(--muted);margin-bottom:8px}
.pager{display:flex;align-items:center;gap:14px;justify-content:center;margin:24px 0}.pager button{min-width:88px}
a{color:var(--green)}:focus-visible{outline:3px solid #b98b30;outline-offset:3px}.answer-panel[open]>summary{margin-bottom:6px}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
@media(max-width:650px){
main{padding:12px 10px 28px}header{padding:20px 16px;border-radius:12px}h1{font-size:25px}header p{font-size:13px;line-height:1.7}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.metrics span{font-size:12px;padding:8px;justify-content:center}.report-button{grid-column:1/-1;justify-content:center;min-height:44px;font-size:15px}
.filter-panel{margin:12px 0;padding:12px}.filter-panel>summary{padding:5px 0}.filter-panel>summary span{display:block;margin:3px 0 0;font-size:12px}
.filters{gap:8px}.filters #set{grid-column:1/-1}.filters select{font-size:14px;padding:10px 8px}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.toggles label{font-size:13px;min-height:44px}
.results-bar{margin:10px 2px}.info{font-size:12px}.q{padding:16px 13px;margin:12px 0}.q h2{font-size:16px}.stem,.options li,.explanation{font-size:15px;line-height:1.85}
.options li{padding:10px}.badge{font-size:11px;padding:3px 6px}.answer{padding:12px}.image-review{padding:8px 10px}.pager{gap:12px}.pager button{flex:1;max-width:150px}
}
@media print{.filter-panel,.pager,.report-button,#load-error{display:none}.q{break-inside:avoid}body{background:#fff}}
</style>
<script src="./review.js?v=20261120-unified" defer></script>
</head>
<body>
<main>
<header>
<h1>PMP逐题复盘</h1>
<p>12月5日中国大陆线下考试 · 2026年11月19日分析</p>
<p>先自己解释“当前问题、谁有权限、下一步动作”，再展开题库答案。</p>
<div class="metrics">
<span id="metric-total">题目加载中</span><span id="metric-wrong">历史错题</span>
<span id="metric-review">待复核</span><span id="metric-duplicates">近重复变式</span>
<a class="report-button" href="./report.html">完整分析报告</a>
</div>
</header>
<details class="filter-panel" id="filters-panel" open>
<summary>筛选题目<span id="filter-summary">仅错题</span></summary>
<fieldset id="filter-controls" disabled>
<div class="filters">
<select id="set" aria-label="选择试卷"><option value="">全部试卷</option></select>
<select id="category" aria-label="选择知识类别"><option value="">全部知识类别</option></select>
<select id="pattern" aria-label="选择误判模式"><option value="">全部误判模式</option></select>
<input id="search" type="search" placeholder="搜索题干、知识点、ID或解释" aria-label="搜索">
</div>
<div class="toggles">
<label><input id="wrong" type="checkbox" checked>只看错题</label>
<label><input id="issues" type="checkbox">只看待复核</label>
<label><input id="dups" type="checkbox">只看近重复题</label>
<label><input id="images" type="checkbox">只看图题</label>
<label><input id="answers" type="checkbox">展开全部答案</label>
</div>
</fieldset>
</details>
<div class="results-bar"><div class="info" id="count" role="status" aria-live="polite">正在加载复盘记录…</div></div>
<div id="load-error" role="alert" hidden><p id="error-message"></p><button type="button" id="retry">重新加载</button></div>
<div id="list" aria-busy="true"><div class="loading" role="status">正在加载题目…</div></div>
<div class="pager"><button id="prev" type="button" disabled>上一页</button><span id="page">—</span><button id="next" type="button" disabled>下一页</button></div>
</main>
</body>
</html>
